<!DOCTYPE html>
<html lang="es" data-theme="modern">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Dashboard Pro</title>
    <style>
        /* === SISTEMA DE TEMAS (Variables CSS) === */
        :root {
            /* Tema Moderno (Por defecto) */
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-alt: #334155;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --primary: #3b82f6;
            --danger: #ef4444;
            --success: #10b981;
            --font: system-ui, -apple-system, sans-serif;
            --radius: 20px;
            --border: 1px solid transparent;
            --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            --btn-radius: 12px;
        }

        [data-theme="minimalist"] {
            --bg: #f9fafb;
            --surface: #ffffff;
            --surface-alt: #e5e7eb;
            --text: #111827;
            --text-dim: #6b7280;
            --primary: #111827;
            --danger: #000000;
            --success: #111827;
            --font: "Helvetica Neue", Helvetica, Arial, sans-serif;
            --radius: 0px;
            --border: 2px solid #111827;
            --shadow: none;
            --btn-radius: 0px;
        }

        [data-theme="retro"] {
            --bg: #000000;
            --surface: #000000;
            --surface-alt: #002200;
            --text: #00ff00;
            --text-dim: #008800;
            --primary: #00ff00;
            --danger: #ff0000;
            --success: #00ff00;
            --font: "Courier New", Courier, monospace;
            --radius: 0px;
            --border: 1px solid #00ff00;
            --shadow: 0 0 15px rgba(0, 255, 0, 0.2);
            --btn-radius: 0px;
        }

        [data-theme="lofi"] {
            --bg: #fdf6e3;
            --surface: #fffbf0;
            --surface-alt: #eee8d5;
            --text: #586e75;
            --text-dim: #93a1a1;
            --primary: #d33682;
            --danger: #dc322f;
            --success: #859900;
            --font: "Georgia", serif;
            --radius: 30px;
            --border: 2px solid #eee8d5;
            --shadow: 6px 6px 0px #eee8d5;
            --btn-radius: 20px;
        }

        [data-theme="cyberpunk"] {
            --bg: #fce300;
            --surface: #000000;
            --surface-alt: #111111;
            --text: #00ffcc;
            --text-dim: #ff003c;
            --primary: #ff003c;
            --danger: #ff003c;
            --success: #00ffcc;
            --font: "Impact", "Arial Black", sans-serif;
            --radius: 0px;
            --border: 2px solid #00ffcc;
            --shadow: 8px 8px 0px #ff003c;
            --btn-radius: 0px;
        }

        /* === ESTILOS GLOBALES === */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font);
            padding: 2rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Header / Theme Switcher */
        .top-bar {
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 1.5rem;
        }

        select {
            background-color: var(--surface);
            color: var(--text);
            border: var(--border);
            padding: 0.5rem 1rem;
            font-family: var(--font);
            border-radius: var(--btn-radius);
            outline: none;
            cursor: pointer;
            font-weight: bold;
        }

        /* Layout Principal */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            width: 100%;
            max-width: 1000px;
        }

        @media (max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }

        .panel {
            background-color: var(--surface);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: var(--border);
        }

        .panel-title {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--surface-alt);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* === TEMPORIZADOR === */
        .modes { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }
        .mode-btn {
            background: var(--surface-alt); color: var(--text-dim);
            border: var(--border); padding: 0.5rem 1rem; font-family: var(--font);
            border-radius: var(--btn-radius); cursor: pointer; flex: 1; font-weight: bold;
        }
        .mode-btn:hover { color: var(--text); }
        .mode-btn.active { background-color: var(--primary); color: var(--bg); border-color: var(--primary); }
        [data-theme="modern"] .mode-btn.active { color: white; }

        .time-display {
            font-size: 5rem; font-weight: bold; text-align: center;
            margin: 1.5rem 0; font-variant-numeric: tabular-nums; line-height: 1;
        }

        .controls { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2rem; }
        .btn {
            padding: 0.8rem 2rem; font-size: 1.1rem; font-weight: bold; font-family: var(--font);
            border: var(--border); border-radius: var(--btn-radius); cursor: pointer;
        }
        .btn-main { background-color: var(--success); color: var(--bg); border-color: var(--success); }
        .btn-main.pause { background-color: var(--danger); border-color: var(--danger); }
        .btn-reset { background-color: var(--surface-alt); color: var(--text); }
        [data-theme="modern"] .btn-main { color: white; }

        /* Ajustes de Tiempo y YouTube */
        .input-row { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
        .input-row input {
            background: var(--surface-alt); color: var(--text); border: var(--border);
            padding: 0.6rem; border-radius: var(--btn-radius); width: 100%; font-family: var(--font); outline: none;
        }
        .input-row input:focus { border-color: var(--primary); }
        .input-row label { font-size: 0.9rem; color: var(--text-dim); min-width: 60px;}
        
        /* === ORGANIZADOR DE TAREAS === */
        .todo-input-container { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
        .todo-input-container input {
            flex: 1; background: var(--surface-alt); color: var(--text); border: var(--border);
            padding: 0.8rem; border-radius: var(--btn-radius); font-family: var(--font); outline: none;
        }
        .btn-add {
            background-color: var(--primary); color: var(--bg); border: var(--border);
            padding: 0 1.5rem; border-radius: var(--btn-radius); cursor: pointer; font-weight: bold;
        }
        [data-theme="modern"] .btn-add { color: white; }

        .task-list { list-style: none; max-height: 350px; overflow-y: auto; }
        .task-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--surface-alt); padding: 0.8rem 1rem; margin-bottom: 0.5rem;
            border-radius: var(--btn-radius); border: var(--border);
        }
        .task-text { flex: 1; cursor: pointer; }
        .task-item.done .task-text { text-decoration: line-through; color: var(--text-dim); opacity: 0.6; }
        
        .task-actions button {
            background: none; border: none; font-size: 1.2rem; cursor: pointer; margin-left: 0.5rem;
        }
        .btn-check { color: var(--success); }
        .btn-delete { color: var(--danger); }

        /* Modal YouTube */
        #yt-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 1000; justify-content: center; align-items: center; flex-direction: column;
        }
        #yt-modal.active { display: flex; }
        iframe { width: 90%; max-width: 800px; height: 450px; border: none; border-radius: 12px; }
        .close-modal {
            background: var(--danger); color: white; border: none; padding: 0.8rem 2rem;
            border-radius: 8px; margin-top: 1.5rem; cursor: pointer; font-weight: bold; font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <select id="theme-selector">
            <option value="modern">Tema: Moderno</option>
            <option value="minimalist">Tema: Minimalista</option>
            <option value="retro">Tema: Retro Terminal</option>
            <option value="lofi">Tema: Lo-Fi Chill</option>
            <option value="cyberpunk">Tema: Cyberpunk</option>
        </select>
    </div>

    <div class="dashboard">
        <!-- PANEL IZQUIERDO: Temporizador -->
        <div class="panel">
            <div class="modes">
                <button class="mode-btn active" data-sec="1500">Pomodoro</button>
                <button class="mode-btn" data-sec="300">Descanso</button>
                <button class="mode-btn" data-sec="900">Largo</button>
                <button class="mode-btn" id="custom-mode-btn">Manual</button>
            </div>

            <div class="time-display" id="time">25:00</div>

            <div class="controls">
                <button class="btn btn-main" id="start-btn">INICIAR</button>
                <button class="btn btn-reset" id="reset-btn">RESET</button>
            </div>

            <div class="panel-title">Tiempo Personalizado</div>
            <div class="input-row">
                <input type="number" id="inp-h" placeholder="Horas" min="0">
                <input type="number" id="inp-m" placeholder="Min" min="0" max="59">
                <input type="number" id="inp-s" placeholder="Seg" min="0" max="59">
                <button class="btn-reset" id="apply-custom" style="padding: 0.6rem 1rem; border-radius: var(--btn-radius); border: var(--border); cursor: pointer; font-weight:bold;">Aplicar</button>
            </div>

            <div class="panel-title" style="margin-top: 1.5rem;">Alarma de YouTube</div>
            <div class="input-row">
                <label>Link:</label>
                <input type="text" id="yt-url" placeholder="https://youtu.be/...">
            </div>
            <div class="input-row">
                <label>Minuto:</label>
                <input type="text" id="yt-start" placeholder="Ej: 1:15 o 75" value="0">
                <button class="btn-reset" id="test-yt-btn" style="padding: 0.6rem; border-radius: var(--btn-radius); cursor: pointer; font-weight:bold;">Probar</button>
            </div>
        </div>

        <!-- PANEL DERECHO: Organizador -->
        <div class="panel">
            <div class="panel-title">Organizador / Tareas</div>
            <div class="todo-input-container">
                <input type="text" id="task-input" placeholder="Escribe una tarea y presiona Enter...">
                <button class="btn-add" id="add-task-btn">+</button>
            </div>
            <ul class="task-list" id="task-list">
                <!-- Tareas generadas por JS -->
            </ul>
        </div>
    </div>

    <!-- Modal YouTube -->
    <div id="yt-modal">
        <div id="video-container" style="width: 100%; display:flex; justify-content:center;"></div>
        <button class="close-modal" id="close-modal-btn">DETENER ALARMA</button>
    </div>

    <script>
        // === GESTIÓN DE TEMAS ===
        const themeSelector = document.getElementById('theme-selector');
        // Cargar tema guardado
        const savedTheme = localStorage.getItem('studyTimerTheme') || 'modern';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeSelector.value = savedTheme;

        themeSelector.addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('studyTimerTheme', e.target.value);
        });


        // === LÓGICA DEL TEMPORIZADOR ===
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modeBtns = document.querySelectorAll('.mode-btn:not(#custom-mode-btn)');
        const customModeBtn = document.getElementById('custom-mode-btn');

        let defaultTime = 25 * 60;
        let timeLeft = defaultTime;
        let timerId = null;
        let isRunning = false;
        let endTime = null;

        function formatTime(totalSeconds) {
            const h = Math.floor(totalSeconds / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            
            const mm = m.toString().padStart(2, '0');
            const ss = s.toString().padStart(2, '0');
            
            if (h > 0) {
                const hh = h.toString().padStart(2, '0');
                return `${hh}:${mm}:${ss}`;
            }
            return `${mm}:${ss}`;
        }

        function updateDisplay() {
            const formatted = formatTime(timeLeft);
            timeDisplay.textContent = formatted;
            document.title = `${formatted} - Study Dashboard`;
        }

        function tick() {
            const now = Date.now();
            timeLeft = Math.round((endTime - now) / 1000);

            if (timeLeft <= 0) {
                timeLeft = 0;
                stopTimer();
                updateDisplay();
                triggerAlarm();
                return;
            }
            updateDisplay();
        }

        function startTimer() {
            if (isRunning) { stopTimer(); return; }
            if (timeLeft <= 0) return;
            isRunning = true;
            endTime = Date.now() + (timeLeft * 1000);
            timerId = setInterval(tick, 200);
            startBtn.textContent = 'PAUSAR';
            startBtn.classList.add('pause');
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerId);
            startBtn.textContent = 'INICIAR';
            startBtn.classList.remove('pause');
        }

        function resetTimer() {
            stopTimer();
            timeLeft = defaultTime;
            updateDisplay();
        }

        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Modos rápidos
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                defaultTime = parseInt(e.target.dataset.sec);
                resetTimer();
            });
        });

        // Tiempo Personalizado (H, M, S)
        document.getElementById('apply-custom').addEventListener('click', () => {
            const h = parseInt(document.getElementById('inp-h').value) || 0;
            const m = parseInt(document.getElementById('inp-m').value) || 0;
            const s = parseInt(document.getElementById('inp-s').value) || 0;
            
            const totalSecs = (h * 3600) + (m * 60) + s;
            
            if (totalSecs > 0) {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                customModeBtn.classList.add('active');
                defaultTime = totalSecs;
                resetTimer();
            }
        });


        // === SISTEMA DE ALARMA Y YOUTUBE ===
        const ytModal = document.getElementById('yt-modal');
        const videoContainer = document.getElementById('video-container');

        function playDefaultAlarm() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function beep(freq, startTime, duration) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.5, startTime + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(startTime); osc.stop(startTime + duration);
            }
            beep(880, audioCtx.currentTime, 0.4);
            beep(880, audioCtx.currentTime + 0.5, 0.4);
        }

        function extractVideoID(url) {
            const match = url.match(/^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            if (timeStr.includes(':')) {
                const parts = timeStr.split(':');
                return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }
            return parseInt(timeStr) || 0;
        }

        function triggerAlarm() {
            const ytUrl = document.getElementById('yt-url').value;
            const ytStart = document.getElementById('yt-start').value;
            const videoId = extractVideoID(ytUrl);

            if (videoId) {
                const startSec = parseTimeToSeconds(ytStart);
                videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&start=${startSec}&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                ytModal.classList.add('active');
            } else {
                playDefaultAlarm();
            }
        }

        document.getElementById('test-yt-btn').addEventListener('click', triggerAlarm);
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            ytModal.classList.remove('active');
            videoContainer.innerHTML = ''; 
        });


        // === GESTOR DE TAREAS (TO-DO LIST) CON LOCALSTORAGE ===
        const taskInput = document.getElementById('task-input');
        const addTaskBtn = document.getElementById('add-task-btn');
        const taskList = document.getElementById('task-list');

        let tasks = JSON.parse(localStorage.getItem('studyTasks')) || [];

        function saveTasks() {
            localStorage.setItem('studyTasks', JSON.stringify(tasks));
        }

        function renderTasks() {
            taskList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = `task-item ${task.done ? 'done' : ''}`;
                
                li.innerHTML = `
                    <span class="task-text">${task.text}</span>
                    <div class="task-actions">
                        <button class="btn-check" onclick="toggleTask(${index})">${task.done ? '↺' : '✓'}</button>
                        <button class="btn-delete" onclick="deleteTask(${index})">✗</button>
                    </div>
                `;
                // Al hacer clic en el texto también se tacha
                li.querySelector('.task-text').addEventListener('click', () => toggleTask(index));
                taskList.appendChild(li);
            });
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text) {
                tasks.push({ text: text, done: false });
                taskInput.value = '';
                saveTasks();
                renderTasks();
            }
        }

        window.toggleTask = function(index) {
            tasks[index].done = !tasks[index].done;
            saveTasks();
            renderTasks();
        }

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            saveTasks();
            renderTasks();
        }

        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Inicializar Todo
        updateDisplay();
        renderTasks();

    </script>
</body>
</html>
