<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador de Estudio Pro</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-bg-light: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-family);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .timer-container, .settings-container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 480px;
            margin-bottom: 1.5rem;
        }

        /* Modos */
        .modes {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: 12px;
        }

        .mode-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 80px;
        }

        .mode-btn:hover { color: var(--text-main); background: rgba(255,255,255,0.05); }
        .mode-btn.active { background-color: var(--primary); color: white; }

        /* Pantalla de tiempo */
        .time-display {
            font-size: 6rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 2rem;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        /* Controles Principales */
        .controls { display: flex; justify-content: center; gap: 1rem; }
        .btn {
            padding: 1rem 2rem; font-size: 1.1rem; font-weight: 600;
            border: none; border-radius: 12px; cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
            width: 140px;
        }
        .btn:active { transform: translateY(2px); }
        .btn-main { background-color: var(--success); color: white; }
        .btn-main:hover { background-color: #059669; }
        .btn-main.pause { background-color: var(--danger); }
        .btn-main.pause:hover { background-color: var(--danger-hover); }
        .btn-reset { background-color: rgba(255,255,255,0.1); color: var(--text-main); }
        .btn-reset:hover { background-color: rgba(255,255,255,0.15); }

        /* Sección de Ajustes (Personalizado y YouTube) */
        .settings-container {
            padding: 1.5rem 2rem;
            text-align: left;
        }
        
        .settings-title {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--card-bg-light);
            padding-bottom: 0.5rem;
        }

        .input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1rem;
            align-items: center;
        }

        .input-group label {
            font-size: 0.9rem;
            width: 120px;
            color: var(--text-muted);
        }

        input[type="number"], input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid var(--card-bg-light);
            background-color: rgba(0,0,0,0.2);
            color: white;
            font-family: var(--font-family);
            outline: none;
        }
        
        input:focus { border-color: var(--primary); }
        
        .btn-small {
            background-color: var(--card-bg-light);
            color: white;
            border: none;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-small:hover { background-color: var(--primary); }

        /* Modal YouTube */
        #yt-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #yt-modal.active { display: flex; }
        
        .close-modal {
            background: var(--danger); color: white;
            border: none; padding: 0.5rem 2rem; border-radius: 8px;
            margin-top: 1rem; cursor: pointer; font-weight: bold; font-size: 1.1rem;
        }

        iframe {
            width: 80%;
            max-width: 800px;
            height: 450px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .hint { font-size: 0.8rem; color: #64748b; margin-top: -0.5rem; margin-bottom: 1rem; margin-left: 135px;}

    </style>
</head>
<body>

    <!-- Temporizador Principal -->
    <div class="timer-container">
        <div class="modes">
            <button class="mode-btn active" data-time="25">Pomodoro</button>
            <button class="mode-btn" data-time="5">Descanso</button>
            <button class="mode-btn" data-time="15">Largo</button>
            <button class="mode-btn" id="custom-mode-btn">Manual</button>
        </div>

        <div class="time-display" id="time">25:00</div>

        <div class="controls">
            <button class="btn btn-main" id="start-btn">Iniciar</button>
            <button class="btn btn-reset" id="reset-btn">Reiniciar</button>
        </div>
    </div>

    <!-- Panel de Ajustes (Personalización y Alarma YouTube) -->
    <div class="settings-container">
        <div class="settings-title">Tiempo Personalizado</div>
        <div class="input-group">
            <label>Minutos:</label>
            <input type="number" id="custom-minutes" placeholder="Ej: 45" min="1">
            <button class="btn-small" id="set-custom-time">Aplicar</button>
        </div>

        <div class="settings-title" style="margin-top: 1.5rem;">Alarma Épica (YouTube)</div>
        <div class="input-group">
            <label>Enlace del vídeo:</label>
            <input type="text" id="yt-url" placeholder="https://youtu.be/...">
        </div>
        <div class="input-group">
            <label>Minuto exacto:</label>
            <input type="text" id="yt-start" placeholder="Ej: 1:15 o 75" value="0">
        </div>
        <div class="hint">Si se deja en blanco, sonará la campana profesional por defecto.</div>
        <div style="text-align: right;">
            <button class="btn-small" id="test-yt-btn">Probar Alarma YouTube</button>
        </div>
    </div>

    <!-- Reproductor Modal Emergente -->
    <div id="yt-modal">
        <div id="video-container"></div>
        <button class="close-modal" id="close-modal-btn">Detener y Cerrar</button>
    </div>

    <script>
        const timeDisplay = document.getElementById('time');
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const modeBtns = document.querySelectorAll('.mode-btn:not(#custom-mode-btn)');
        const customModeBtn = document.getElementById('custom-mode-btn');
        const ytModal = document.getElementById('yt-modal');
        const videoContainer = document.getElementById('video-container');

        let defaultTime = 25 * 60;
        let timeLeft = defaultTime;
        let timerId = null;
        let isRunning = false;
        let endTime = null;

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateDisplay() {
            const formatted = formatTime(timeLeft);
            timeDisplay.textContent = formatted;
            document.title = `${formatted} - Temporizador`;
        }

        // --- SISTEMA DE ALARMAS ---

        // Campana por defecto (Web Audio API)
        function playDefaultAlarm() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            function beep(freq, startTime, duration) {
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0, startTime);
                gainNode.gain.linearRampToValueAtTime(0.5, startTime + 0.05);
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start(startTime);
                oscillator.stop(startTime + duration);
            }
            beep(880, audioCtx.currentTime, 0.4);
            beep(880, audioCtx.currentTime + 0.5, 0.4);
        }

        // Utilidades para procesar YouTube
        function extractVideoID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function parseTimeToSeconds(timeStr) {
            if (!timeStr) return 0;
            if (timeStr.includes(':')) {
                const parts = timeStr.split(':');
                return parseInt(parts[0]) * 60 + parseInt(parts[1]);
            }
            return parseInt(timeStr) || 0;
        }

        // Reproductor de YouTube
        function playYouTubeAlarm(url, startTimeStr) {
            const videoId = extractVideoID(url);
            if (!videoId) {
                playDefaultAlarm(); // Si el link no es válido, suena la campana normal
                return;
            }

            const startSeconds = parseTimeToSeconds(startTimeStr);
            
            // Inyectamos el iframe con autoplay habilitado
            videoContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1&start=${startSeconds}&rel=0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            ytModal.classList.add('active');
        }

        function triggerAlarm() {
            const ytUrl = document.getElementById('yt-url').value;
            const ytStart = document.getElementById('yt-start').value;

            if (ytUrl.trim() !== '') {
                playYouTubeAlarm(ytUrl, ytStart);
            } else {
                playDefaultAlarm();
            }
        }

        // Cerrar Modal
        document.getElementById('close-modal-btn').addEventListener('click', () => {
            ytModal.classList.remove('active');
            videoContainer.innerHTML = ''; // Destruye el iframe para detener el audio
        });

        // Probar alarma manual
        document.getElementById('test-yt-btn').addEventListener('click', triggerAlarm);

        // --- LÓGICA DEL TEMPORIZADOR ---

        function tick() {
            const now = Date.now();
            timeLeft = Math.round((endTime - now) / 1000);

            if (timeLeft <= 0) {
                timeLeft = 0;
                stopTimer();
                updateDisplay();
                triggerAlarm();
                return;
            }
            updateDisplay();
        }

        function startTimer() {
            if (isRunning) { stopTimer(); return; }
            isRunning = true;
            endTime = Date.now() + (timeLeft * 1000);
            timerId = setInterval(tick, 200);
            startBtn.textContent = 'Pausar';
            startBtn.classList.add('pause');
        }

        function stopTimer() {
            isRunning = false;
            clearInterval(timerId);
            startBtn.textContent = 'Iniciar';
            startBtn.classList.remove('pause');
        }

        function resetTimer() {
            stopTimer();
            timeLeft = defaultTime;
            updateDisplay();
        }

        // --- EVENTOS ---
        startBtn.addEventListener('click', startTimer);
        resetBtn.addEventListener('click', resetTimer);

        // Cambio de modos predefinidos
        modeBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                defaultTime = parseInt(e.target.dataset.time) * 60;
                resetTimer();
            });
        });

        // Tiempo personalizado
        document.getElementById('set-custom-time').addEventListener('click', () => {
            const mins = document.getElementById('custom-minutes').value;
            if (mins && mins > 0) {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                customModeBtn.classList.add('active');
                defaultTime = parseInt(mins) * 60;
                resetTimer();
            }
        });

        customModeBtn.addEventListener('click', () => {
            // Si hacen clic en el botón de manual pero ya hay un tiempo asignado, lo resetea a ese tiempo
            const mins = document.getElementById('custom-minutes').value;
            if (mins && mins > 0) {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                customModeBtn.classList.add('active');
                defaultTime = parseInt(mins) * 60;
                resetTimer();
            } else {
                document.getElementById('custom-minutes').focus();
            }
        });

        // Inicializar
        updateDisplay();
    </script>
</body>
</html>
