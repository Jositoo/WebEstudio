<!DOCTYPE html>
<html lang="es" data-theme="modern">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudio Pro OS | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            /* TEMA MODERN (Default) */
            --bg: #0b0f1a; --surface: #161b2c; --surface-alt: #232a3f;
            --text: #ffffff; --text-dim: #94a3b8; --primary: #3b82f6;
            --accent: #8b5cf6; --success: #10b981; --danger: #ef4444;
            --font-main: 'Inter', sans-serif; --font-mono: 'JetBrains Mono', monospace;
            --radius: 12px; --shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* VARIACIONES DE TEMAS */
        [data-theme="dracula"] {
            --bg: #282a36; --surface: #44475a; --surface-alt: #6272a4;
            --text: #f8f8f2; --text-dim: #94a3b8; --primary: #bd93f9; --accent: #ff79c6;
        }
        [data-theme="nord"] {
            --bg: #2e3440; --surface: #3b4252; --surface-alt: #4c566a;
            --text: #eceff4; --text-dim: #d8dee9; --primary: #88c0d0; --accent: #81a1c1;
        }
        [data-theme="matcha"] {
            --bg: #f4f1ea; --surface: #ffffff; --surface-alt: #e9e5d9;
            --text: #2d3748; --text-dim: #718096; --primary: #7ea172; --accent: #556b2f;
        }
        [data-theme="cyberpunk"] {
            --bg: #000000; --surface: #111111; --surface-alt: #222222;
            --text: #00ffcc; --text-dim: #ff003c; --primary: #fce300; --accent: #ff003c;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.2s ease; }
        body { background: var(--bg); color: var(--text); font-family: var(--font-main); display: flex; height: 100vh; overflow: hidden; }

        /* SIDEBAR */
        nav {
            width: 260px; background: var(--surface); border-right: 1px solid var(--surface-alt);
            display: flex; flex-direction: column; padding: 2rem 1rem;
        }
        .logo { font-size: 1.4rem; font-weight: 800; margin-bottom: 2.5rem; text-align: center; color: var(--primary); }
        .nav-link {
            padding: 0.8rem 1rem; border-radius: var(--radius); cursor: pointer;
            color: var(--text-dim); display: flex; align-items: center; gap: 12px;
            text-decoration: none; font-weight: 600; margin-bottom: 0.5rem;
        }
        .nav-link:hover, .nav-link.active { background: var(--surface-alt); color: var(--text); }
        .nav-link.active { border-left: 4px solid var(--primary); }

        /* MAIN */
        main { flex: 1; padding: 2rem; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .view { display: none; width: 100%; max-width: 900px; animation: slideUp 0.4s ease; }
        .view.active { display: block; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* CARDS */
        .card { background: var(--surface); padding: 2rem; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 1.5rem; border: 1px solid var(--surface-alt); }
        .card-title { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dim); margin-bottom: 1.5rem; font-weight: 800; }

        /* TIMER H:M:S */
        .timer-display { font-family: var(--font-mono); font-size: 6.5rem; font-weight: 800; text-align: center; margin: 1rem 0; letter-spacing: -2px; }
        .progress-container { width: 100%; height: 6px; background: var(--surface-alt); border-radius: 10px; margin-bottom: 2rem; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 100%; }
        
        .timer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 1.5rem; }
        .timer-input-group { text-align: center; }
        .timer-input-group label { font-size: 0.7rem; color: var(--text-dim); display: block; margin-bottom: 5px; }
        .timer-input-group input { width: 100%; background: var(--surface-alt); border: 1px solid transparent; color: var(--text); padding: 0.8rem; border-radius: 8px; text-align: center; font-family: var(--font-mono); font-size: 1.2rem; }
        
        .btn-group { display: flex; gap: 1rem; justify-content: center; }
        .btn { padding: 0.8rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-outline { background: var(--surface-alt); color: var(--text); }

        /* LISTAS (Tareas y Deadlines) */
        .item-list { list-style: none; }
        .item { display: flex; align-items: center; justify-content: space-between; background: var(--surface-alt); padding: 1rem; border-radius: 8px; margin-bottom: 0.8rem; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; background: var(--primary); color: #000; }

        /* UTILS */
        textarea { width: 100%; height: 200px; background: var(--surface-alt); color: var(--text); padding: 1rem; border-radius: 8px; border: none; resize: none; font-family: inherit; }
        select { width: 100%; padding: 0.8rem; background: var(--surface-alt); color: var(--text); border-radius: 8px; border: none; }

        /* MOBILE */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            nav { width: 100%; height: auto; flex-direction: row; padding: 0.5rem; order: 2; overflow-x: auto; }
            .logo { display: none; }
            .nav-link { margin-bottom: 0; font-size: 0.7rem; flex-direction: column; gap: 4px; min-width: 80px; }
            main { order: 1; padding: 1rem; height: calc(100vh - 70px); }
            .timer-display { font-size: 3.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">STUDY<span>OS</span></div>
        <div class="nav-link active" data-target="timer-view">⏱️ Timer</div>
        <div class="nav-link" data-target="tasks-view">📝 Tareas</div>
        <div class="nav-link" data-target="deadlines-view">📅 Entregas</div>
        <div class="nav-link" data-target="notes-view">📔 Notas</div>
        <div class="nav-link" data-target="settings-view">⚙️ Ajustes</div>
    </nav>

    <main>
        <section id="timer-view" class="view active">
            <div class="card">
                <div class="card-title">Temporizador de Enfoque</div>
                <div class="progress-container"><div class="progress-bar" id="pb"></div></div>
                <div class="timer-display" id="display">00:25:00</div>
                
                <div class="timer-grid">
                    <div class="timer-input-group"><label>HORAS</label><input type="number" id="h" value="0" min="0"></div>
                    <div class="timer-input-group"><label>MINUTOS</label><input type="number" id="m" value="25" min="0" max="59"></div>
                    <div class="timer-input-group"><label>SEGUNDOS</label><input type="number" id="s" value="0" min="0" max="59"></div>
                </div>

                <div class="btn-group">
                    <button class="btn btn-primary" id="start-btn">Iniciar Sesión</button>
                    <button class="btn btn-outline" id="reset-btn">Reset</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Estadísticas de Hoy</div>
                <p id="stats-text">Has completado 0 sesiones de estudio hoy.</p>
            </div>
        </section>

        <section id="tasks-view" class="view">
            <div class="card">
                <div class="card-title">Tareas Pendientes</div>
                <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;">
                    <input type="text" id="task-in" style="flex:1; background: var(--surface-alt); border:none; padding: 10px; border-radius: 5px; color: #fff;" placeholder="Ej: Estudiar Anatomía...">
                    <button class="btn btn-primary" id="add-task">Añadir</button>
                </div>
                <ul class="item-list" id="task-list"></ul>
            </div>
        </section>

        <section id="deadlines-view" class="view">
            <div class="card">
                <div class="card-title">Próximos Exámenes / Entregas</div>
                <div style="display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; margin-bottom: 1.5rem;">
                    <input type="text" id="dead-name" style="background: var(--surface-alt); border:none; padding: 10px; border-radius: 5px; color:#fff;" placeholder="Nombre...">
                    <input type="date" id="dead-date" style="background: var(--surface-alt); border:none; padding: 10px; border-radius: 5px; color:#fff;">
                    <button class="btn btn-primary" id="add-dead">Añadir</button>
                </div>
                <ul class="item-list" id="dead-list"></ul>
            </div>
        </section>

        <section id="notes-view" class="view">
            <div class="card">
                <div class="card-title">Bloc de Notas Rápido</div>
                <textarea id="notes-area" placeholder="Escribe tus pensamientos aquí..."></textarea>
            </div>
        </section>

        <section id="settings-view" class="view">
            <div class="card">
                <div class="card-title">Personalización de Interfaz</div>
                <label style="font-size: 0.8rem; color:var(--text-dim);">SELECCIONAR TEMA:</label>
                <select id="theme-change" style="margin-top: 10px;">
                    <option value="modern">Modern Dark (Default)</option>
                    <option value="dracula">Dracula (Dev Pro)</option>
                    <option value="nord">Nordic Blue</option>
                    <option value="matcha">Matcha Green (Light)</option>
                    <option value="cyberpunk">Cyberpunk Neon</option>
                </select>
            </div>
            <div class="card">
                <div class="card-title">Alarma YouTube</div>
                <input type="text" id="yt-url" style="width:100%; background: var(--surface-alt); border:none; padding: 12px; border-radius: 5px; color:#fff;" placeholder="URL de video de YouTube...">
            </div>
        </section>
    </main>

    <div id="alarm-box" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; flex-direction:column; align-items:center; justify-content:center;">
        <div id="video-container"></div>
        <button class="btn btn-danger" id="stop-alarm" style="margin-top:20px;">DETENER ALARMA Y VOLVER</button>
    </div>

    <script>
        // ESTADO GLOBAL
        let timeLeft = 1500;
        let totalSeconds = 1500;
        let timerId = null;
        let isRunning = false;
        let sessionsToday = parseInt(localStorage.getItem('study_sessions')) || 0;

        // ELEMENTOS
        const display = document.getElementById('display');
        const startBtn = document.getElementById('start-btn');
        const pb = document.getElementById('pb');

        // NAVEGACIÓN
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', () => {
                document.querySelectorAll('.nav-link, .view').forEach(el => el.classList.remove('active'));
                link.classList.add('active');
                document.getElementById(link.dataset.target).classList.add('active');
            });
        });

        // TIMER LOGIC
        function updateDisplay() {
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            display.textContent = `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            const perc = (timeLeft / totalSeconds) * 100;
            pb.style.width = `${perc}%`;
        }

        startBtn.addEventListener('click', () => {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                startBtn.textContent = "Reanudar";
                startBtn.className = "btn btn-primary";
            } else {
                if (timeLeft === totalSeconds || timeLeft === 0) {
                    const hh = parseInt(document.getElementById('h').value) || 0;
                    const mm = parseInt(document.getElementById('m').value) || 0;
                    const ss = parseInt(document.getElementById('s').value) || 0;
                    totalSeconds = (hh * 3600) + (mm * 60) + ss;
                    timeLeft = totalSeconds;
                }
                if (timeLeft <= 0) return;
                isRunning = true;
                startBtn.textContent = "Pausar";
                startBtn.className = "btn btn-danger";
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        triggerAlarm();
                        sessionsToday++;
                        localStorage.setItem('study_sessions', sessionsToday);
                        renderStats();
                    }
                }, 1000);
            }
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = totalSeconds;
            startBtn.textContent = "Iniciar Sesión";
            startBtn.className = "btn btn-primary";
            updateDisplay();
        });

        // ALARMA
        function triggerAlarm() {
            const url = document.getElementById('yt-url').value;
            const box = document.getElementById('alarm-box');
            const container = document.getElementById('video-container');
            box.style.display = 'flex';
            if(url.includes('v=')) {
                const id = url.split('v=')[1].split('&')[0];
                container.innerHTML = `<iframe width="560" height="315" src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allow="autoplay"></iframe>`;
            } else {
                container.innerHTML = `<h1 style="color:white">¡TIEMPO TERMINADO!</h1>`;
                const audio = new AudioContext(); // Simple beep if no YT
            }
        }
        document.getElementById('stop-alarm').addEventListener('click', () => {
            document.getElementById('alarm-box').style.display = 'none';
            document.getElementById('video-container').innerHTML = '';
        });

        // TAREAS
        let tasks = JSON.parse(localStorage.getItem('study_tasks')) || [];
        function renderTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '';
            tasks.forEach((t, i) => {
                const li = document.createElement('li');
                li.className = 'item';
                li.innerHTML = `<span>${t}</span><button class="btn btn-danger" style="padding:5px 10px" onclick="removeTask(${i})">X</button>`;
                list.appendChild(li);
            });
            localStorage.setItem('study_tasks', JSON.stringify(tasks));
        }
        document.getElementById('add-task').addEventListener('click', () => {
            const val = document.getElementById('task-in').value;
            if(val) { tasks.push(val); document.getElementById('task-in').value = ''; renderTasks(); }
        });
        window.removeTask = (i) => { tasks.splice(i, 1); renderTasks(); };

        // ENTREGAS (DEADLINES)
        let deadlines = JSON.parse(localStorage.getItem('study_deadlines')) || [];
        function renderDeadlines() {
            const list = document.getElementById('dead-list');
            list.innerHTML = '';
            deadlines.forEach((d, i) => {
                const diff = Math.ceil((new Date(d.date) - new Date()) / (1000*60*60*24));
                const li = document.createElement('li');
                li.className = 'item';
                li.innerHTML = `<div><b>${d.name}</b><br><small>${d.date}</small></div> <span class="badge">${diff} días faltan</span> <button class="btn btn-danger" style="padding:5px 10px" onclick="removeDead(${i})">X</button>`;
                list.appendChild(li);
            });
            localStorage.setItem('study_deadlines', JSON.stringify(deadlines));
        }
        document.getElementById('add-dead').addEventListener('click', () => {
            const n = document.getElementById('dead-name').value;
            const d = document.getElementById('dead-date').value;
            if(n && d) { deadlines.push({name: n, date: d}); renderDeadlines(); }
        });
        window.removeDead = (i) => { deadlines.splice(i, 1); renderDeadlines(); };

        // NOTAS Y TEMAS
        document.getElementById('notes-area').value = localStorage.getItem('study_notes') || '';
        document.getElementById('notes-area').addEventListener('input', (e) => localStorage.setItem('study_notes', e.target.value));

        document.getElementById('theme-change').addEventListener('change', (e) => {
            document.documentElement.setAttribute('data-theme', e.target.value);
            localStorage.setItem('study_theme', e.target.value);
        });
        
        function renderStats() { document.getElementById('stats-text').textContent = `Has completado ${sessionsToday} sesiones de estudio hoy. ¡Buen trabajo!`; }

        // INIT
        const st = localStorage.getItem('study_theme') || 'modern';
        document.documentElement.setAttribute('data-theme', st);
        document.getElementById('theme-change').value = st;
        renderTasks(); renderDeadlines(); renderStats(); updateDisplay();
    </script>
</body>
</html>
